        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('/sw.js').then(function(reg) {
                    console.log('PWA SW Registered:', reg.scope);
                    reg.update();
                    reg.addEventListener('updatefound', function() {
                        var newWorker = reg.installing;
                        if (newWorker) {
                            newWorker.addEventListener('statechange', function() {
                                if (newWorker.state === 'activated') {
                                    console.log('PWA SW updated to new version');
                                }
                            });
                        }
                    });
                }).catch(function(err) {
                    console.error('PWA SW Register failed:', err);
                });
            });
        }
    </script>

    <style>
        * { -webkit-tap-highlight-color: transparent; }
        html, body, button, input { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        h1, h2, .chrome-text, .font-black { font-family: 'Manrope', 'Inter', -apple-system, sans-serif; letter-spacing: -0.02em; }
        
        :root {
            /* Cleo Cloud — premium Apple-inspired dark palette (monochrome, no purple/pink theme) */
            --bg-color: #050505;
            --bg-elevated: #0d0d0d;
            --text-primary: #FFFFFF;
            --text-secondary: rgba(255,255,255,0.55);
            --border-color: rgba(255,255,255,0.12);
            --glass-fill: rgba(255,255,255,0.06);
            --glass-fill-strong: rgba(255,255,255,0.1);
            --glass-blur: 24px;
            --nm-shadow-flat: 0 8px 24px rgba(0,0,0,0.35);
            --nm-shadow-inset: inset 0 1px 0 rgba(255,255,255,0.06);
            --nm-shadow-flat-sm: 0 4px 12px rgba(0,0,0,0.3);
            --nm-shadow-inset-sm: inset 0 1px 0 rgba(255,255,255,0.05);
            --ease-spring: cubic-bezier(0.22, 1, 0.36, 1);
        }
        :root.light-mode {
            --bg-color: #f4f4f6;
            --bg-elevated: #ffffff;
            --text-primary: #0b0b0d;
            --text-secondary: #6b6874;
            --border-color: rgba(0, 0, 0, 0.08);
            --glass-fill: rgba(255, 255, 255, 0.65);
            --glass-fill-strong: rgba(255, 255, 255, 0.85);
        }


        html, body { background: var(--bg-color); color: var(--text-primary); transition: background 0.6s cubic-bezier(0.22, 1, 0.36, 1), color 0.6s cubic-bezier(0.22, 1, 0.36, 1); }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 20px); }
        .pt-safe { padding-top: max(2.5rem, env(safe-area-inset-top)); }
        .fill-current { fill: currentColor; }
        .filter-tab.active { background: rgba(255,255,255,0.92) !important; color: black !important; box-shadow: 0 4px 20px rgba(255,255,255,0.15); }

        /* ===== Cleo Cloud dynamic ambient background ===== */
        .app-bg {
            position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none;
            background: var(--bg-color);
        }
        .app-bg::before {
            content: ''; position: absolute; inset: -20%;
            background:
                radial-gradient(circle at 18% 15%, rgba(255,255,255,0.05) 0%, transparent 45%),
                radial-gradient(circle at 85% 20%, rgba(255,255,255,0.035) 0%, transparent 45%),
                radial-gradient(circle at 50% 90%, rgba(255,255,255,0.03) 0%, transparent 50%);
            filter: blur(60px);
        }

        /* ===== Frosted glass system ===== */
        .glass-card {
            background: var(--glass-fill);
            backdrop-filter: blur(var(--glass-blur)) saturate(160%);
            -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(160%);
            border: 1px solid var(--border-color);
            box-shadow: var(--nm-shadow-flat), var(--nm-shadow-inset);
            border-radius: 1.25rem;
            transition: transform 0.35s var(--ease-spring), background 0.35s ease, box-shadow 0.35s ease;
        }
        .glass-card:hover {
            background: var(--glass-fill-strong);
            border-color: rgba(255, 255, 255, 0.16);
            transform: translateY(-2px);
        }
        .glass-dock {
            background: rgba(10, 10, 13, 0.72);
            backdrop-filter: blur(30px) saturate(180%);
            -webkit-backdrop-filter: blur(30px) saturate(180%);
            border: 1px solid var(--border-color);
            box-shadow: 0 -8px 40px rgba(0, 0, 0, 0.55);
        }

        .glass, .cc-panel {
            background: var(--glass-fill);
            backdrop-filter: blur(var(--glass-blur)) saturate(160%);
            -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(160%);
            box-shadow: var(--nm-shadow-flat), var(--nm-shadow-inset);
            border: 1px solid var(--border-color);
            border-radius: 1.25rem;
            transition: all 0.35s var(--ease-spring);
        }
        .glass-hover {
            transition: transform 0.35s var(--ease-spring), background 0.3s ease;
        }
        .glass-hover:hover {
            background: var(--glass-fill-strong);
            transform: translateY(-2px);
        }
        .glass-strong {
            background: var(--glass-fill-strong);
            backdrop-filter: blur(var(--glass-blur)) saturate(160%);
            -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(160%);
            box-shadow: var(--nm-shadow-flat), var(--nm-shadow-inset);
            border: 1px solid var(--border-color);
            border-radius: 1.25rem;
            transition: transform 0.5s var(--ease-spring), box-shadow 0.5s var(--ease-spring);
        }
        .glass-input {
            background: var(--glass-fill);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            box-shadow: var(--nm-shadow-inset-sm);
            border: 1px solid var(--border-color);
            border-radius: 0.9rem;
            transition: box-shadow 0.4s var(--ease-spring), border-color 0.4s var(--ease-spring);
        }
        .glass-input:focus-within, .glass-input:focus {
            border-color: rgba(255,255,255,0.35);
            box-shadow: 0 0 0 3px rgba(255,255,255,0.1);
        }
        .glass-pane {
            background: var(--bg-elevated);
        }
        .glass-edge {
            border: 1px solid var(--border-color);
        }

        /* Cleo Cloud gradient wordmark */
        .chrome-text{
            background: linear-gradient(135deg, #ffffff 0%, #ffffff 60%, rgba(255,255,255,0.7) 100%);
            -webkit-background-clip: text; background-clip: text; color: transparent;
            font-weight: 800;
        }

        .btn-chrome {
            position: relative;
            overflow: hidden;
            background: var(--glass-fill-strong);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            box-shadow: var(--nm-shadow-flat-sm);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            border-radius: 999px;
            transition: transform 0.4s var(--ease-spring), box-shadow 0.4s var(--ease-spring);
        }
        .btn-chrome:hover {
            transform: scale(1.02);
            border-color: rgba(255,255,255,0.22);
        }
        .btn-chrome:active {
            transform: scale(0.98);
        }

        .shine-sweep{position:relative;}

        .nav-blur {
            background: rgba(8, 8, 10, 0.72);
            backdrop-filter: blur(30px) saturate(180%);
            -webkit-backdrop-filter: blur(30px) saturate(180%);
            border-top: 1px solid var(--border-color);
            box-shadow: 0 -8px 30px rgba(0, 0, 0, 0.5);
        }
        .artist-photo { width:120px; height:120px; border-radius:50%; object-fit:cover; border:1px solid var(--border-color); box-shadow:var(--nm-shadow-flat); background:var(--bg-elevated); }

        /* ===== Cleo Cloud profile / social components ===== */
        .cc-header-blur {
            background: rgba(5,5,6,0.55);
            backdrop-filter: blur(24px) saturate(160%);
            -webkit-backdrop-filter: blur(24px) saturate(160%);
        }
        .cc-pill {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 5px 12px; border-radius: 999px;
            background: var(--glass-fill); border: 1px solid var(--border-color);
            color: var(--text-secondary); font-weight: 600;
        }
        .cc-social-card {
            display: flex; align-items: center; gap: 14px;
            padding: 14px 16px; border-radius: 24px;
            background: var(--glass-fill);
            backdrop-filter: blur(var(--glass-blur)) saturate(160%);
            -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(160%);
            border: 1px solid var(--border-color);
            transition: transform 0.3s var(--ease-spring), background 0.3s ease, border-color 0.3s ease;
        }
        .cc-social-card:hover {
            transform: translateY(-2px);
            background: var(--glass-fill-strong);
            border-color: rgba(255,255,255,0.18);
        }
        .cc-social-icon {
            width: 42px; height: 42px; border-radius: 13px; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center; color: #fff;
        }
        .cc-ig-icon { background: linear-gradient(135deg, #f9ce34 0%, #ee2a7b 50%, #6228d7 100%); }
        .cc-wa-icon { background: #25D366; }
        .cc-open-btn {
            width: 30px; height: 30px; border-radius: 999px; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12); color: rgba(255,255,255,0.7);
            transition: background 0.25s ease, color 0.25s ease;
        }
        .cc-social-card:hover .cc-open-btn { background: #fff; color: #000; }
        .cc-btn-primary {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            padding: 15px 20px; border-radius: 999px; font-weight: 700; font-size: 14px;
            background: #ffffff;
            color: #000000;
            box-shadow: 0 10px 30px rgba(255,255,255,0.12);
            transition: transform 0.3s var(--ease-spring), box-shadow 0.3s var(--ease-spring);
        }
        .cc-btn-primary:active { transform: scale(0.97); }
        @keyframes fadeUp{from{transform:translateY(12px);opacity:0}to{transform:translateY(0);opacity:1}}
        .animate-slide-up{animation:fadeUp 0.35s ease-out forwards}


        /* ===== SPLASH SCREEN - LIGHTWEIGHT ===== */
        #splash-screen {
            position: fixed; inset: 0; z-index: 9999;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            background: radial-gradient(circle at 50% 40%, #17141c 0%, #050506 70%);
            opacity: 1;
            transition: opacity 0.3s ease-out, visibility 0.3s ease-out;
        }
        #splash-screen.hide {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .splash-logo-wrap {
            position: relative;
            width: 130px; height: 130px;
            border-radius: 50%;
            background: rgba(0,0,0,0.8);
            border: 2px solid rgba(255,255,255,0.25);
            display: flex; align-items: center; justify-content: center;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(255,255,255,0.12);
        }
        .splash-logo-wrap img {
            width: 85%; height: 85%;
            object-fit: cover;
            border-radius: 50%;
        }

        .splash-title { margin-top: 26px; font-weight: 900; font-size: 1.1rem; letter-spacing: .06em; }
        .splash-sub { margin-top: 6px; font-size: .7rem; color: rgba(255,255,255,0.4); letter-spacing: .1em; text-transform: uppercase; opacity: .8; }
        .splash-bar { margin-top: 24px; width: 120px; height: 2px; border-radius: 2px; background: rgba(255,255,255,0.15); overflow: hidden; }
        .splash-bar i { display: block; height: 100%; width: 40%; background: linear-gradient(90deg, transparent, #ff6ec7, transparent); animation: splashBar 1.4s ease-in-out infinite; }
        @keyframes splashBar { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }

        /* High-Performance Blurred Artwork Background for Player & Lyrics */
        .player-bg-container {
            position: absolute;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
            background-color: #050506;
            will-change: transform;
            transform: translateZ(0);
        }

        .player-bg-blur-img {
            position: absolute;
            inset: -10%;
            width: 120%;
            height: 120%;
            object-fit: cover;
            filter: blur(24px) brightness(0.65) contrast(1.1);
            -webkit-filter: blur(24px) brightness(0.65) contrast(1.1);
            opacity: 0.85;
            transition: opacity 0.3s ease;
            will-change: opacity, transform;
            transform: translateZ(0);
        }

        .player-bg-glow {
            position: absolute;
            inset: -25%;
            z-index: 0;
            opacity: 0;
            mix-blend-mode: screen;
            filter: blur(34px);
            background-repeat: no-repeat;
            background-image:
                radial-gradient(circle at 22% 28%, var(--glow-c1, transparent) 0%, transparent 60%),
                radial-gradient(circle at 78% 35%, var(--glow-c2, transparent) 0%, transparent 60%),
                radial-gradient(circle at 42% 82%, var(--glow-c3, transparent) 0%, transparent 60%);
            background-size: 140% 140%;
            animation: glowDrift 9s ease-in-out infinite;
            will-change: transform;
            transition: opacity 0.6s ease;
            pointer-events: none;
        }

        @keyframes glowDrift {
            0%   { transform: translate3d(0%, 0%, 0) scale(1) rotate(0deg); }
            20%  { transform: translate3d(6%, -8%, 0) scale(1.14) rotate(9deg); }
            40%  { transform: translate3d(-9%, 4%, 0) scale(0.92) rotate(-7deg); }
            60%  { transform: translate3d(5%, 9%, 0) scale(1.1) rotate(11deg); }
            80%  { transform: translate3d(-6%, -6%, 0) scale(0.95) rotate(-9deg); }
            100% { transform: translate3d(0%, 0%, 0) scale(1) rotate(0deg); }
        }

        @media (prefers-reduced-motion: reduce) {
            .player-bg-glow { animation: none; }
        }

        .player-bg-vignette {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 1;
            background: linear-gradient(to bottom, rgba(5, 5, 6,0.55) 0%, rgba(5, 5, 6,0.25) 45%, rgba(5, 5, 6,0.8) 100%);
        }

        /* Extra Dark & Heavy Blur Background for Lyrics Overlay */
        #lyrics-overlay {
            background-color: #050506 !important;
        }
        #lyrics-overlay .player-bg-blur-img {
            filter: blur(60px) brightness(0.18) contrast(1.2) saturate(110%) !important;
            -webkit-filter: blur(60px) brightness(0.18) contrast(1.2) saturate(110%) !important;
            opacity: 0.65 !important;
        }
        #lyrics-overlay .player-bg-vignette {
            background: radial-gradient(circle at center, rgba(24,5,17,0.82) 0%, rgba(24,5,17,0.96) 100%),
                        linear-gradient(to bottom, rgba(24,5,17,0.9) 0%, rgba(24,5,17,0.8) 50%, rgba(24,5,17,0.98) 100%) !important;
        }

        /* Premium Lyric Highlighting Styling */
        #lyrics-scroll-container {
            -webkit-overflow-scrolling: touch;
        }
        .lyric-line {
            transition: opacity 0.35s cubic-bezier(0.25, 1, 0.5, 1), transform 0.35s cubic-bezier(0.25, 1, 0.5, 1), color 0.35s cubic-bezier(0.25, 1, 0.5, 1);
            font-size: 1.45rem;
            font-weight: 800;
            color: rgba(255, 255, 255, 0.35);
            opacity: 0.4;
            padding: 10px 0;
            line-height: 1.35;
            letter-spacing: -0.02em;
            will-change: opacity, color, transform;
            cursor: pointer;
            text-align: left;
            transform-origin: left center;
        }
        @media (min-width: 768px) {
            .lyric-line {
                font-size: 2.15rem;
                padding: 14px 0;
                line-height: 1.3;
            }
        }
        .lyric-line.active-lyric {
            opacity: 1 !important;
            color: #ffffff !important;
            transform: scale(1.06) translateX(4px);
        }
        .lyric-line.past-lyric {
            opacity: 0.28 !important;
            color: rgba(255, 255, 255, 0.4) !important;
            transform: scale(0.97);
        }
        .lyric-translation {
            display: block;
            font-size: 0.58em;
            font-weight: 500;
            opacity: 0.75;
            margin-top: 4px;
            letter-spacing: 0;
            line-height: 1.35;
            color: inherit;
        }
        .inline-lyric-line .lyric-translation {
            font-size: 0.78em;
            margin-top: 2px;
            opacity: 0.8;
            font-weight: 500;
        }

        /* Inline Lyric Highlighting for FullPlayer Compact Box */
        .inline-lyric-line {
            transition: opacity 0.25s ease, color 0.25s ease;
            font-size: 0.92rem;
            line-height: 1.4;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.4);
            opacity: 0.5;
            padding: 5px 0;
            letter-spacing: -0.01em;
            cursor: pointer;
            text-align: left;
            word-break: break-word;
        }
        .inline-lyric-line.active-lyric {
            opacity: 1 !important;
            color: #ffffff !important;
            font-weight: 800 !important;
        }
        .inline-lyric-line.past-lyric {
            opacity: 0.3 !important;
            color: rgba(255, 255, 255, 0.35) !important;
        }

        /* Neumorphic Equalizer & Slider styling */
        .eq-slider {
            -webkit-appearance: none;
            width: 8px;
            height: 150px;
            background: var(--bg-color);
            box-shadow: var(--nm-shadow-inset-sm);
            border-radius: 4px;
            outline: none;
            writing-mode: bt-lr; /* IE */
            -webkit-appearance: slider-vertical; /* WebKit */
        }
        .eq-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--bg-color);
            box-shadow: var(--nm-shadow-flat-sm);
            border: 2px solid var(--border-color);
            cursor: pointer;
            transition: transform 0.1s;
        }
        .eq-slider::-webkit-slider-thumb:active {
            transform: scale(1.15);
            box-shadow: var(--nm-shadow-inset-sm);
        }



        /* Animated Bouncing Equalizer Bars for Active Track */
        @keyframes eqBounce1 { 0%, 100% { height: 3px; } 50% { height: 20px; } }
        @keyframes eqBounce2 { 0%, 100% { height: 18px; } 50% { height: 4px; } }
        @keyframes eqBounce3 { 0%, 100% { height: 5px; } 50% { height: 24px; } }
        @keyframes eqBounce4 { 0%, 100% { height: 22px; } 50% { height: 6px; } }
        @keyframes eqBounce5 { 0%, 100% { height: 4px; } 50% { height: 16px; } }
        @keyframes eqBounce6 { 0%, 100% { height: 26px; } 50% { height: 8px; } }

        .animate-eq-1 { animation: eqBounce1 0.45s ease-in-out infinite; }
        .animate-eq-2 { animation: eqBounce2 0.65s ease-in-out infinite; }
        .animate-eq-3 { animation: eqBounce3 0.50s ease-in-out infinite; }
        .animate-eq-4 { animation: eqBounce4 0.80s ease-in-out infinite; }
        .animate-eq-5 { animation: eqBounce5 0.60s ease-in-out infinite; }
        .animate-eq-6 { animation: eqBounce6 0.70s ease-in-out infinite; }

        /* Equalizer live-animated bar visualizer */
        .eq-bar {
            width: 5px;
            height: 10px;
            background: linear-gradient(to top, rgba(255,255,255,0.55), #ffffff);
            border-radius: 2px;
            transition: height 0.1s ease-out;
        }

        /* Responsive Bottom Navigation Bar Styles */
        .nav-blur {
            background: rgba(8, 8, 10, 0.72);
            backdrop-filter: blur(30px) saturate(180%);
            -webkit-backdrop-filter: blur(30px) saturate(180%);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 -8px 30px rgba(0, 0, 0, 0.5);
        }
        .nav-icon-wrapper {
            transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.5s cubic-bezier(0.22, 1, 0.36, 1);
        }

        /* Page Slide Animations */
        @keyframes slideInRight {
            0% { transform: translateX(30px); opacity: 0; }
            100% { transform: translateX(0); opacity: 1; }
        }
        @keyframes slideInLeft {
            0% { transform: translateX(-30px); opacity: 0; }
            100% { transform: translateX(0); opacity: 1; }
        }
        .animate-slide-right {
            animation: slideInRight 0.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
        .animate-slide-left {
            animation: slideInLeft 0.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        /* Search Results & Cards Entrance Animations */
        @keyframes cardUp {
            0% { opacity: 0; transform: translateY(10px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes cardLeft {
            0% { opacity: 0; transform: translateX(-10px); }
            100% { opacity: 1; transform: translateX(0); }
        }
        .animate-card-up {
            animation: cardUp 0.6s cubic-bezier(0.22, 1, 0.36, 1) both;
        }
        .animate-card-left {
            animation: cardLeft 0.6s cubic-bezier(0.22, 1, 0.36, 1) both;
        }
        .transition-all, .transition, .transition-colors, .transition-opacity, .transition-transform {
            transition-duration: 500ms !important;
            transition-timing-function: cubic-bezier(0.22, 1, 0.36, 1) !important;
        }

        /* ===== Performance: cheap off-screen skip for long lists ===== */
        .home-cat-card, .search-rec-item {
            content-visibility: auto;
            contain-intrinsic-size: 0 64px;
        }
    </style>
</head>
